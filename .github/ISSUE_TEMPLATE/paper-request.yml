name: Paper request
description: Suggest a missing paper, dataset, benchmark, or resource
title: "[Paper] "
labels:
  - paper-request
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the collection. Please verify metadata against the paper or official project page.
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: Full paper or resource title
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Paper URL
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: input
    id: venue
    attributes:
      label: Venue and year
      placeholder: CoRL 2025 or arXiv 2026
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project or code URL
      placeholder: https://...
  - type: dropdown
    id: section
    attributes:
      label: Suggested primary section
      options:
        - Surveys and Taxonomies
        - Foundation and Generalist Models
        - World Models and Generative Policies
        - Reasoning, Planning, and Skill Composition
        - Imitation Learning and Coordination Representations
        - Reinforcement Learning
        - Humanoid and Dexterous Bimanual Learning
        - Datasets, Benchmarks, and Platforms
        - Related General Robot-Learning Methods
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Suggested tags
      placeholder: VLA, IL, Real, Sim
  - type: textarea
    id: relevance
    attributes:
      label: Bimanual relevance
      description: Briefly explain whether the work is bimanual-specific or bimanual-evaluated.
    validations:
      required: true
